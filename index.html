<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo Reeder</title>
<link rel="icon" href="data:," />
<style>
:root {
  --accent: #2c7be5;
  --bg: #f3f4f6;
  --card: #ffffff;
  --muted: #666;
  --radius: 10px;
}
* { box-sizing: border-box; }
body {
  margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:#111; -webkit-font-smoothing:antialiased;
  transition: background 0.2s, color 0.2s;
}
header { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:linear-gradient(90deg,#0b63d6,#2c7be5); color:#fff; }
header h1 { margin:0; font-size:20px; }
.icon-btn { background:transparent; border:0; color:#fff; cursor:pointer; font-size:18px; padding:6px; border-radius:6px; }
.icon-btn:hover { background: rgba(255,255,255,0.06); }
main { max-width:900px; margin:18px auto; padding:16px; }
.card { background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:0 6px 18px rgba(15,15,15,0.04); margin-bottom:12px; transition: background 0.2s, color 0.2s; }
textarea { width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; min-height:120px; font-size:16px; resize:none; }
#textDisplay { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
.word { background:var(--accent); color:#fff; padding:6px 10px; border-radius:8px; cursor:pointer; transition: background 0.2s; }
.word:hover { background:#0b63d6; }
button { padding:8px 10px; border-radius:8px; border:none; cursor:pointer; background:var(--accent); color:#fff; margin-right:6px; transition: background 0.2s; }
button.ghost { background:transparent; border:1px solid rgba(44,123,229,0.2); color:var(--accent); }
button:hover { opacity:0.9; }
video { width:100%; border-radius:10px; margin-top:8px; }
canvas { display:none; }
@media(max-width:720px){ textarea{ min-height:100px; } }
</style>
</head>
<body>

<header>
  <h1>Halo Reeder</h1>
  <button id="darkModeBtn" class="icon-btn" title="Toggle Dark Mode">🌓</button>
</header>

<main>
  <div class="card">
    <label>Paste or type text:</label>
    <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
    <div style="margin-top:8px;">
      <button id="processBtn">Process Text</button>
      <button id="readBtn">Read Text</button>
      <button id="stopBtn" class="ghost">Stop Reading</button>
      <button id="clearBtn" class="ghost">Clear</button>
    </div>
  </div>

  <div class="card">
    <label>Or capture from camera:</label>
    <video id="camera" autoplay playsinline></video>
    <button id="captureBtn">Capture & Read</button>
    <canvas id="snapshot"></canvas>
  </div>

  <div class="card">
    <strong>Tap a word to see definition:</strong>
    <div id="textDisplay"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script>
// Dark mode
const darkModeBtn = document.getElementById('darkModeBtn');
let darkMode = false;
darkModeBtn.onclick = () => {
  darkMode = !darkMode;
  document.body.style.background = darkMode ? '#111' : 'var(--bg)';
  document.body.style.color = darkMode ? '#fff' : '#111';
  document.querySelectorAll('.card').forEach(c=>{
    c.style.background = darkMode ? '#222' : 'var(--card)';
    c.style.color = darkMode ? '#fff' : '#111';
    c.style.borderColor = darkMode ? '#444' : '#ddd';
  });
}

// DOM
const inputText = document.getElementById('inputText');
const textDisplay = document.getElementById('textDisplay');
const synth = window.speechSynthesis;
let utter;

// Process text into clickable words
document.getElementById('processBtn').onclick = () => {
  textDisplay.innerHTML = '';
  const words = inputText.value.split(/\s+/).filter(w=>w);
  words.forEach(w=>{
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    span.onclick = () => {
      window.open(`https://www.merriam-webster.com/dictionary/${encodeURIComponent(w)}`, '_blank');
    };
    textDisplay.appendChild(span);
  });
}

// Read text
document.getElementById('readBtn').onclick = () => {
  if(!inputText.value) return;
  if(synth.speaking) synth.cancel();
  utter = new SpeechSynthesisUtterance(inputText.value);
  synth.speak(utter);
}
document.getElementById('stopBtn').onclick = () => { if(synth.speaking) synth.cancel(); }

// Clear
document.getElementById('clearBtn').onclick = () => {
  inputText.value = '';
  textDisplay.innerHTML = '';
  if(synth.speaking) synth.cancel();
}

// Camera & OCR
const video = document.getElementById('camera');
const canvas = document.getElementById('snapshot');
const captureBtn = document.getElementById('captureBtn');

navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
  video.srcObject = stream;
});

captureBtn.onclick = async () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video,0,0);
  const { data: { text } } = await Tesseract.recognize(canvas, 'eng', { logger: m => console.log(m) });
  inputText.value = text.trim();
  document.getElementById('processBtn').click();
  document.getElementById('readBtn').click();
}
</script>

</body>
</html>
