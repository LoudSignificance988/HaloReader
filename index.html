<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halo Reeder</title>
<link rel="icon" href="data:," />
<style>
:root {
  --accent: #2c7be5;
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #111;
  --muted: #666;
  --radius: 10px;
}
body {
  margin:0;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
header {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 18px;
  background:linear-gradient(90deg,#0b63d6,#2c7be5);
  color:#fff;
}
header h1 { margin:0; font-size:20px; }
.icon-btn { background:transparent; border:0; color:#fff; cursor:pointer; font-size:18px; padding:6px; border-radius:6px; }
.icon-btn:hover { background: rgba(255,255,255,0.1); }
main { max-width:1100px; margin:18px auto; padding:16px; }
.card { background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:0 6px 18px rgba(15,15,15,0.04); margin-bottom:12px; }
button.btn { background:var(--accent); border:0; color:#fff; padding:8px 10px; border-radius:8px; cursor:pointer; }
button.btn.ghost { background:transparent; color:var(--accent); border:1px solid rgba(44,123,229,0.12); }
textarea, input { width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; font-size:16px; }
#imagePreview { max-width:100%; margin-top:12px; border-radius:8px; }
footer { text-align:center; color:#777; font-size:13px; padding:12px; }

@media(max-width:720px){ header { flex-direction:column; align-items:flex-start; gap:8px; } }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="logo.png" alt="Halo Logo" style="height:32px;">
    <h1>Halo Reeder</h1>
  </div>
  <button id="darkModeBtn" class="icon-btn" title="Toggle Dark Mode">🌓</button>
</header>

<main>
  <div class="card">
    <button id="pickImage" class="btn">Pick Image</button>
    <button id="cameraCapture" class="btn ghost">Camera</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <video id="cameraStream" autoplay style="display:none; width:100%; margin-top:12px; border-radius:8px;"></video>
    <img id="imagePreview" src="" alt="">
  </div>

  <div class="card">
    <textarea id="textOutput" placeholder="OCR text will appear here..." rows="6"></textarea>
    <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
      <button id="speakBtn" class="btn">Speak</button>
      <button id="copyBtn" class="btn ghost">Copy</button>
      <button id="downloadBtn" class="btn ghost">Download</button>
      <button id="translateBtn" class="btn ghost">Translate</button>
    </div>
  </div>
</main>

<footer>Halo Reeder — Blue Theme | Mobile-first | GitHub Pages ready</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kokoro-js/dist/kokoro.min.js"></script>
<script>
// Dark Mode
const darkBtn = document.getElementById('darkModeBtn');
darkBtn.onclick = () => {
  document.body.style.background = document.body.style.background === 'black' ? '#f3f4f6' : 'black';
  document.body.style.color = document.body.style.color === '#fff' ? '#111' : '#fff';
};

// Image Picking
const pickImageBtn = document.getElementById('pickImage');
const fileInput = document.getElementById('fileInput');
const imagePreview = document.getElementById('imagePreview');
pickImageBtn.onclick = () => fileInput.click();
fileInput.onchange = e => {
  const file = e.target.files[0];
  if(file){
    const url = URL.createObjectURL(file);
    imagePreview.src = url;
    recognizeText(url);
  }
};

// Camera Capture
const camBtn = document.getElementById('cameraCapture');
const camStream = document.getElementById('cameraStream');
let stream;
camBtn.onclick = async () => {
  if(!stream){
    stream = await navigator.mediaDevices.getUserMedia({video:true});
    camStream.srcObject = stream;
    camStream.style.display='block';
  } else {
    const track = stream.getVideoTracks()[0];
    const imageCapture = new ImageCapture(track);
    imageCapture.takePhoto().then(blob=>{
      const url = URL.createObjectURL(blob);
      imagePreview.src = url;
      recognizeText(url);
    });
  }
};

// OCR
const textOutput = document.getElementById('textOutput');
function recognizeText(imgUrl){
  Tesseract.recognize(imgUrl, 'eng', {logger: m=>console.log(m)})
    .then(({data:{text}})=> textOutput.value = text);
}

// TTS
const speakBtn = document.getElementById('speakBtn');
speakBtn.onclick = () => {
  const text = textOutput.value;
  if(!text) return;
  const utter = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utter);
};

// Copy
const copyBtn = document.getElementById('copyBtn');
copyBtn.onclick = () => navigator.clipboard.writeText(textOutput.value);

// Download
const downloadBtn = document.getElementById('downloadBtn');
downloadBtn.onclick = () => {
  const blob = new Blob([textOutput.value], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download='text.txt';
  a.click();
};

// Translate (Google Translate)
const translateBtn = document.getElementById('translateBtn');
translateBtn.onclick = () => {
  const text = encodeURIComponent(textOutput.value);
  window.open(`https://translate.google.com/?sl=auto&tl=en&text=${text}&op=translate`);
};
</script>

</body>
</html>
